<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0b14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>RELIC : 잊혀진 영웅</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-name"><span id="hud-lv">Lv.1</span> <span id="hud-cls">검투사</span></div>
      <div class="bar hp"><div class="fill" id="hp-fill"></div><span id="hp-text">0/0</span></div>
      <div class="bar mp"><div class="fill" id="mp-fill"></div><span id="mp-text">0/0</span></div>
      <div class="bar exp"><div class="fill" id="exp-fill"></div></div>
      <div class="hud-status" id="hud-status"></div>
    </div>
    <div class="hud-right">
      <canvas id="minimap" width="96" height="96"></canvas>
      <div class="hud-area" id="hud-area">루멘</div>
      <div class="hud-gold">💰 <span id="hud-gold">0</span></div>
    </div>
    <button id="btn-menu" class="round-btn" aria-label="메뉴">☰</button>
    <button id="btn-quest" class="quest-tracker" aria-label="퀘스트"></button>
  </div>

  <div id="boss-bar" class="hidden">
    <div class="boss-name" id="boss-name">보스</div>
    <div class="bar boss"><div class="fill" id="boss-fill"></div></div>
  </div>
  <div id="combo" class="hidden"><div class="combo-n" id="combo-n">COMBO ×2</div><div class="combo-b" id="combo-b">+5%</div></div>
  <div id="toasts"></div>
  <div id="banner" class="hidden"></div>

  <!-- 조작 -->
  <div id="controls" class="hidden">
    <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <div id="btns">
      <button class="act-btn" id="btn-act">대화</button>
      <button class="cbtn atk" id="btn-atk"><span class="lbl">공격</span></button>
      <button class="cbtn s1" id="btn-s1"><span class="ico" id="s1-ico">✦</span><span class="lbl" id="s1-lbl">스킬1</span><span class="cd" id="s1-cd"></span></button>
      <button class="cbtn s2" id="btn-s2"><span class="ico" id="s2-ico">✦</span><span class="lbl" id="s2-lbl">스킬2</span><span class="cd" id="s2-cd"></span></button>
      <button class="cbtn dodge" id="btn-dodge"><span class="lbl">회피</span><span class="cd" id="dodge-cd"></span></button>
      <button class="cbtn pot" id="btn-pot"><span class="ico">🧪</span><span class="cnt" id="pot-cnt">0</span></button>
    </div>
  </div>

  <!-- 대화창 -->
  <div id="dialog" class="hidden">
    <div class="dlg-name" id="dlg-name"></div>
    <div class="dlg-text" id="dlg-text"></div>
    <div class="dlg-choices" id="dlg-choices"></div>
    <div class="dlg-next" id="dlg-next">▼</div>
  </div>

  <!-- 모달 패널 (메뉴/상점/대장간 등) -->
  <div id="panel" class="hidden">
    <div class="win">
      <div class="win-head"><span id="panel-title">메뉴</span><button id="panel-close" class="x-btn" aria-label="닫기">✕</button></div>
      <div class="win-tabs" id="panel-tabs"></div>
      <div class="win-body" id="panel-body"></div>
    </div>
  </div>
  <div id="popup" class="hidden"><div class="pop" id="pop"></div></div>

  <!-- 타이틀 -->
  <div id="title" class="screen">
    <div class="title-bg"></div>
    <div class="title-inner">
      <div class="logo">RELIC</div>
      <div class="logo-sub">잊혀진 영웅</div>
      <canvas id="title-art" width="216" height="80"></canvas>
      <div class="title-btns">
        <button class="big-btn" id="btn-new">새 모험</button>
        <button class="big-btn" id="btn-continue">이어하기</button>
      </div>
      <div class="help">
        <b>키보드</b> 이동 WASD/방향키 · 공격 J · 스킬 K / L · 회피 Space · 물약 Q · 대화 E · 메뉴 Esc<br />
        <b>터치</b> 왼쪽 드래그로 이동 · 오른쪽 버튼으로 전투
      </div>
      <div class="ver">GDD v1.0 · build 0.1</div>
    </div>
  </div>

  <!-- 직업 선택 -->
  <div id="select" class="screen hidden">
    <div class="sel-title">직업을 선택하세요</div>
    <div class="sel-list" id="sel-list"></div>
    <div class="sel-detail" id="sel-detail"></div>
    <button class="big-btn" id="btn-start">이 직업으로 시작</button>
    <button class="link-btn" id="btn-back">← 돌아가기</button>
  </div>

  <!-- 스토리 -->
  <div id="story" class="screen hidden">
    <div class="story-text" id="story-text"></div>
    <div class="story-hint">화면을 누르면 계속</div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/sheet-data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/map.js"></script>
<script src="js/audio.js"></script>
<script src="js/entities.js"></script>
<script src="js/quest.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
