<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0b14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>RELIC : 잊혀진 영웅</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-face"><canvas id="hud-face" width="96" height="96"></canvas><span class="hud-lvbadge" id="hud-lv">1</span></div>
      <div class="hud-bars">
        <div class="hud-name"><span id="hud-cls">검투사</span><span class="hud-status" id="hud-status"></span></div>
        <div class="bar hp"><div class="fill" id="hp-fill"></div><span id="hp-text">0/0</span></div>
        <div class="bar mp"><div class="fill" id="mp-fill"></div><span id="mp-text">0/0</span></div>
        <div class="bar exp"><div class="fill" id="exp-fill"></div></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="mm-wrap"><canvas id="minimap" width="96" height="96"></canvas><div class="hud-area" id="hud-area">루멘</div></div>
      <div class="hud-gold"><span>💰 <b id="hud-gold">0</b></span><span>💎 <b id="hud-gems">0</b></span></div>
    </div>
    <button id="btn-menu" class="round-btn" aria-label="메뉴"><span></span><span></span><span></span><i id="menu-dot" class="dot hidden"></i></button>
    <button id="btn-quest" class="quest-tracker" aria-label="퀘스트"></button>
    <div id="quick" class="quick">
      <button data-tab="캐릭터" aria-label="스탯"><span>👤</span><small>스탯</small><i class="dot hidden" id="q-dot-stat"></i></button>
      <button data-tab="장비" aria-label="장비"><span>⚔️</span><small>장비</small></button>
      <button data-tab="가방" aria-label="가방"><span>🎒</span><small>가방</small></button>
      <button data-tab="스킬" aria-label="스킬"><span>✨</span><small>스킬</small><i class="dot hidden" id="q-dot-skill"></i></button>
    </div>
  </div>

  <div id="boss-bar" class="hidden">
    <div class="boss-name" id="boss-name">보스</div>
    <div class="bar boss"><div class="fill" id="boss-fill"></div></div>
  </div>
  <div id="link" class="hidden"></div>
  <div id="combo" class="hidden"><div class="combo-n" id="combo-n">COMBO ×2</div><div class="combo-b" id="combo-b">+5%</div></div>
  <div id="target" class="hidden"><div class="tg-name" id="tg-name"></div><div class="bar tg"><div class="fill" id="tg-fill"></div></div></div>
  <div id="syslog"></div>
  <div id="expbar"><div class="fill" id="xb-fill"></div><span id="xb-text"></span></div>
  <div id="toasts"></div>
  <div id="banner" class="hidden"></div>

  <!-- 조작 -->
  <div id="controls" class="hidden">
    <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <div id="btns">
      <button class="act-btn" id="btn-act">대화</button>
      <button class="cbtn atk" id="btn-atk"><span class="lbl">공격</span></button>
      <button class="cbtn s1" id="btn-s1"><span class="ico" id="s1-ico">✦</span><span class="lbl" id="s1-lbl">스킬1</span><span class="cd" id="s1-cd"></span></button>
      <button class="cbtn s2" id="btn-s2"><span class="ico" id="s2-ico">✦</span><span class="lbl" id="s2-lbl">스킬2</span><span class="cd" id="s2-cd"></span></button>
      <button class="cbtn s3" id="btn-s3"><span class="ico" id="s3-ico">✦</span><span class="lbl" id="s3-lbl">스킬3</span><span class="cd" id="s3-cd"></span></button>
      <button class="cbtn s4" id="btn-s4"><span class="ico" id="s4-ico">✦</span><span class="lbl" id="s4-lbl">스킬4</span><span class="cd" id="s4-cd"></span></button>
      <button class="cbtn s5 hidden" id="btn-s5"><span class="ico" id="s5-ico">✦</span><span class="lbl" id="s5-lbl">궁극기</span><span class="cd" id="s5-cd"></span></button>
      <button class="cbtn dodge" id="btn-dodge"><span class="lbl">회피</span><span class="cd" id="dodge-cd"></span></button>
      <button class="cbtn pot" id="btn-pot"><span class="ico">🧪</span><span class="cnt" id="pot-cnt">0</span><span class="cd" id="pot-cd"></span></button>
      <button class="cbtn pot mp" id="btn-mp"><span class="ico">💧</span><span class="cnt" id="mp-cnt">0</span><span class="cd" id="mp-cd"></span></button>
    </div>
  </div>

  <!-- 대화창 -->
  <div id="dialog" class="hidden">
    <div class="dlg-face"><canvas id="dlg-face" width="120" height="120"></canvas></div>
    <div class="dlg-main">
      <div class="dlg-name" id="dlg-name"></div>
      <div class="dlg-text" id="dlg-text"></div>
    </div>
    <div class="dlg-choices" id="dlg-choices"></div>
    <div class="dlg-next" id="dlg-next">▼</div>
  </div>

  <!-- 메뉴 시트 (메뉴/상점/대장간 등) -->
  <div id="panel" class="hidden">
    <div class="sheet">
      <header class="sheet-head">
        <button id="panel-close" class="icon-btn" aria-label="닫기">✕</button>
        <div class="sheet-title" id="panel-title">메뉴</div>
        <div class="wallet" id="wallet"></div>
      </header>
      <div class="sheet-body" id="panel-body"></div>
      <nav class="tabbar" id="panel-tabs"></nav>
    </div>
  </div>
  <div id="popup" class="hidden"><div class="pop" id="pop"></div></div>

  <!-- 타이틀 -->
  <div id="title" class="screen">
    <canvas class="scr-fx" id="title-fx"></canvas>
    <div class="title-inner">
      <div class="logo" data-t="RELIC">RELIC</div>
      <div class="logo-sub">잊 혀 진 &nbsp;영 웅</div>
      <canvas id="title-art" width="648" height="260"></canvas>
      <div class="title-btns">
        <button class="big-btn" id="btn-new">새 모험</button>
        <button class="big-btn ghost" id="btn-continue">이어하기</button>
      </div>
      <div class="help">
        <b>터치</b> 왼쪽 드래그 이동 · 화면을 누르면 그곳으로 이동 · 몬스터를 누르면 자동 공격<br />
        <b>키보드</b> 이동 WASD · 공격 J · 스킬 K / L / U · 회피 Space · 물약 Q / R · 대화 E · 메뉴 Esc
      </div>
      <div class="ver">build 0.5</div>
    </div>
  </div>

  <!-- 직업 선택 -->
  <div id="select" class="screen hidden">
    <canvas class="scr-fx" id="sel-fx"></canvas>
    <div class="sel-top"><button class="sel-back" id="btn-back">‹</button><span>직업 선택</span><em id="sel-count">1 / 4</em></div>
    <div class="sel-stage" id="sel-stage-wrap">
      <div class="sel-en" id="sel-en">GLADIATOR</div>
      <canvas id="sel-stage"></canvas>
      <button class="sel-arrow l" id="sel-prev" aria-label="이전">‹</button>
      <button class="sel-arrow r" id="sel-next" aria-label="다음">›</button>
    </div>
    <div class="sel-name"><b id="sel-name">검투사</b><div class="sel-tag" id="sel-tag"></div><div class="sel-chips" id="sel-chips"></div></div>
    <div class="sel-info" id="sel-info"></div>
    <div class="sel-tabs" id="sel-tabs"></div>
    <button class="big-btn start" id="btn-start">이 직업으로 모험 시작</button>
  </div>

  <!-- 스토리 -->
  <div id="story" class="screen hidden">
    <canvas class="scr-fx" id="story-fx"></canvas>
    <div class="story-text" id="story-text"></div>
    <div class="story-dots" id="story-dots"></div>
    <div class="story-hint">화면을 누르면 계속</div>
  </div>
  <div id="fade"></div>
</div>

<script src="js/data.js"></script>
<script src="js/sheet-data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/map.js"></script>
<script src="js/grid.js"></script>
<script src="js/audio.js"></script>
<script src="js/entities.js"></script>
<script src="js/progression.js"></script>
<script src="js/season.js"></script>
<script src="js/quest.js"></script>
<script src="assets/anim/manifest.js"></script>
<script src="js/anim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script src="js/game.js"></script>
</body>
</html>
