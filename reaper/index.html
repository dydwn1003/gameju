<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a1c">
  <title>저승사자 키우기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading">
    <div class="ld-sky"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="ld-moon"></div>
    <div class="ld-logo"><small>도트 방치형 저승 근무기</small><b>저승사자 키우기</b></div>
    <div class="ld-souls"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="ld-bottom"><div class="ld-bar"><i id="ld-fill"></i><canvas id="ld-walker" width="16" height="20"></canvas></div><p id="ld-msg">저승 문을 여는 중…</p><p class="ld-tip" id="ld-tip"></p></div>
  </div>
  <div id="app">
    <section id="stage">
      <canvas id="cv"></canvas>
      <div id="hud">
        <div class="bar">
          <div class="cur"><img class="px" data-ic="soul"><b id="v-soul">0</b></div>
          <div class="cur jade" id="cur-jade"><img class="px" data-ic="jade"><b id="v-jade">0</b><i>+</i></div>
          <button class="hb" id="btn-notice" aria-label="공지사항"><b class="emo-s">📢</b><i class="dot"></i></button>
          <button class="hb" id="btn-mail" aria-label="우편함"><b class="emo-s">📮</b><i class="dot"></i></button>
          <button class="hb" id="btn-rankb" aria-label="순위"><b class="emo-s">🏆</b></button>
          <button class="hb" id="btn-set" aria-label="설정"><img class="px" data-ui="gear" style="width:18px"></button>
        </div>
        <div class="rankline">
          <button id="me-card" aria-label="내 정보"><span class="me-por"><canvas id="me-por" width="44" height="51"></canvas></span><span class="me-txt"><b id="me-nick"></b><span><span id="v-lv" class="lvtag">Lv.1</span><span id="rank-badge" class="badge"></span></span></span></button>
          <span id="region" class="region"></span><span id="rk-chip" class="rkchip"></span>
        </div>
        <div class="rate">초당 <b id="v-rate">0</b><span id="boost-on" class="boost-on">×2</span></div>
        <div class="buffs" id="buffs"></div>
        <button id="story-bar"></button>
      </div>
      <div id="side">
        <button id="btn-boost" class="sbtn"><img class="px" data-ui="luck"><span>2배 부적</span><em>AD</em><small id="boost-t"></small></button>
        <button id="btn-attend" class="sbtn"><img class="px" data-ui="ledger"><span>출석</span><i class="dot"></i></button>
        <button id="btn-parade" class="sbtn parade"><img class="px" data-ui="wraith"><span>백귀야행</span><small id="parade-t"></small><i class="dot"></i></button>
        <button id="btn-quest" class="sbtn"><img class="px" data-ic="scroll"><span>의뢰</span><i class="dot"></i></button>
        <button id="btn-office" class="sbtn"><b class="emo">🏯</b><span>집무실</span><i class="dot"></i></button>
      </div>
      <div id="labels"></div>
      <div id="drag-hint">◀ 화면을 끌어서 둘러보기 ▶</div>
      <div id="test-bar"></div>
      <div id="parade-bar"></div>
      <div id="floats"></div>
    </section>
    <section id="menu">
      <div id="sheet"><button id="sheet-h" aria-label="메뉴 닫기"><i></i></button><div id="panel"></div></div>
      <nav id="tabs">
        <button data-tab="grow"><img class="px" data-ui="pen">성장<i class="dot"></i></button>
        <button data-tab="minion"><img class="px" data-ui="minion">졸개<i class="dot"></i></button>
        <button data-tab="life"><img class="px" data-ui="flower">생활<i class="dot"></i></button>
        <button data-tab="pet"><img class="px" data-ui="petic">펫<i class="dot"></i></button>
        <button data-tab="rank"><img class="px" data-ui="gate">승진<i class="dot"></i></button>
        <button data-tab="shop"><img class="px" data-ui="luck">상점<i class="dot"></i></button>
      </nav>
    </section>
  </div>
  <div id="modal"></div>
  <div id="promo"></div>
  <div id="toasts"></div>

  <script src="js/pixel.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/reaper2.js"></script>
  <script src="js/art3.js"></script>
  <script src="js/petart3.js"></script>
  <script src="js/tiny.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/magic.js"></script>
  <script src="js/decor.js"></script>
  <script src="js/decor2.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/game.js"></script>
  <script src="js/life.js"></script>
  <script src="js/pets.js"></script>
  <script src="js/petart.js"></script>
  <script src="js/story.js"></script>
  <script src="js/config.js"></script>
  <script src="js/native.js"></script>
  <script src="js/push.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/board.js"></script>
  <script src="js/ui.js"></script>
  <script>UI.init();</script>
</body>
</html>
