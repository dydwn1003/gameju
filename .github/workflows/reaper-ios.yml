# 저승사자 키우기 — iOS 빌드 → TestFlight 업로드
#
# 실행: GitHub → Actions → "저승사자 iOS TestFlight" → Run workflow
#       또는 reaper-v1.0.0 같은 태그를 push 하면 자동 실행
# reaper/ 를 고쳐서 push 하면 "빌드 확인"(서명 없이 컴파일만)이 자동으로 돌아요
# 서명은 App Store Connect API 키로 Xcode 자동 서명(클라우드 인증서)을 쓴다. 필요한 Secrets 는 reaper/docs/APP_RELEASE.md 참고
name: 저승사자 iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: '빌드만 확인 (서명 · 업로드 안 함)'
        type: boolean
        default: false
  push:
    tags: ['reaper-v*']
    branches-ignore: [main]
    paths: ['reaper/**', '.github/workflows/reaper-ios.yml']

concurrency:
  group: reaper-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: reaper/app
    env:
      TEAM_ID: V9RLBAGQZD
      BUNDLE_ID: com.jeoseungsaja.idle
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      CHECK_ONLY: ${{ github.event.inputs.check_only == 'true' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 고르기 (App Store 는 Xcode 26 이상으로 빌드해야 받아줘요)
        run: |
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$x" ] || x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] || { echo "::error::이 러너에 Xcode 26 이상이 없어요"; ls /Applications | grep -i xcode; exit 1; }
          echo "사용할 Xcode: $x"
          sudo xcode-select -s "$x"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reaper/app/package-lock.json

      - name: 버전 정하기 (빌드 번호는 매 실행마다 +1)
        id: ver
        run: |
          name=$(grep -o "version: '[0-9.]*'" ../js/config.js | head -1 | grep -o "[0-9.]*")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$(( 100 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: 게임 파일 → 앱 (www) → iOS 프로젝트
        run: node build-www.js && npx cap sync ios

      - name: 빌드 확인 (서명 없이 컴파일)
        if: env.CHECK_ONLY == 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -quiet build
          echo "### 저승사자 iOS 빌드 확인 OK" >> "$GITHUB_STEP_SUMMARY"

      - name: App Store Connect API 키 복원
        if: env.CHECK_ONLY != 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 secret 이 필요해요 (reaper/docs/APP_RELEASE.md 참고)"; exit 1
          fi
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: API 키 · 앱 등록 확인
        if: env.CHECK_ONLY != 'true'
        run: |
          head -1 "$ASC_KEY_PATH" | grep -q "BEGIN PRIVATE KEY" \
            || { echo "::error::ASC_KEY_P8_BASE64 를 풀었더니 .p8 파일 모양이 아니에요. p8 파일을 base64 로 다시 바꿔서 넣어주세요."; exit 1; }
          python3 -m venv "$RUNNER_TEMP/jwt" && "$RUNNER_TEMP/jwt/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/jwt/bin/python" - <<'PY'
          import os, time, jwt, urllib.request, urllib.error
          key = open(os.environ['ASC_KEY_PATH']).read(); bid = os.environ['BUNDLE_ID']
          token = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'].strip(), 'iat': int(time.time()),
               'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'},
              key, algorithm='ES256',
              headers={'kid': os.environ['ASC_KEY_ID'].strip(), 'typ': 'JWT'})
          req = urllib.request.Request(
              f'https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]={bid}',
              headers={'Authorization': f'Bearer {token}'})
          try:
              body = urllib.request.urlopen(req).read().decode()
              print('API 키 확인 OK')
              if f'"{bid}"' not in body:
                  print(f'::error::API 키는 맞는데 App Store Connect 에 {bid} 앱이 없어요. 앱을 먼저 등록해주세요 (APP_RELEASE.md 5번).')
                  raise SystemExit(1)
          except urllib.error.HTTPError as e:
              msg = {401: 'Apple 이 키를 거부했어요(401). ASC_KEY_ID · ASC_ISSUER_ID · p8 파일이 같은 키에서 나온 것인지, "팀 키"인지 확인해주세요.',
                     403: '키 권한이 부족해요(403). App Store Connect 에서 키 역할을 "관리자(Admin)" 로 만들어주세요.'}
              print(f'::error::{msg.get(e.code, f"Apple 응답 {e.code}")}')
              raise SystemExit(1)
          PY

      - name: 아카이브 (자동 서명)
        if: env.CHECK_ONLY != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            -quiet archive

      - name: TestFlight 업로드
        if: env.CHECK_ONLY != 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### 저승사자 iOS ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.build }})" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect 로 올렸어요. 처리(10~30분)가 끝나면 TestFlight 에 나타나요." >> "$GITHUB_STEP_SUMMARY"
